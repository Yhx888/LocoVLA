<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08131f"/>
      <stop offset="0.55" stop-color="#0c1c30"/>
      <stop offset="1" stop-color="#11273f"/>
    </linearGradient>
    <linearGradient id="cool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f5fa"/>
      <stop offset="1" stop-color="#c9d4e6"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc16a"/>
      <stop offset="1" stop-color="#ff6f61"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- 冷暖两枚极简角标 -->
  <line x1="60" y1="60" x2="110" y2="60" stroke="#5fd0e0" stroke-width="3" stroke-linecap="round" opacity="0.65"/>
  <line x1="1140" y1="340" x2="1090" y2="340" stroke="#ff8a5c" stroke-width="3" stroke-linecap="round" opacity="0.65"/>

  <!-- eyebrow 小字 -->
  <text x="600" y="82" text-anchor="middle" fill="#7d8aa5" font-size="14" font-weight="600" letter-spacing="4">AN OPEN CURRICULUM FOR EMBODIED AI</text>

  <!-- 主字标：Loco 冷白 · VLA 暖色 -->
  <text x="600" y="196" text-anchor="middle" font-size="108" font-weight="600" letter-spacing="-2"><tspan fill="url(#cool)">Loco</tspan><tspan fill="url(#warm)">VLA</tspan></text>

  <!-- 副标题 -->
  <text x="600" y="244" text-anchor="middle" fill="#c3cbdd" font-size="24" font-weight="400">From Balance Control to Vision-Language-Action</text>
  <text x="600" y="274" text-anchor="middle" fill="#7f8ba6" font-size="16" font-weight="400">具身运动智能 · 从平衡控制到视觉语言动作</text>

  <!-- 能力管线：冷→暖 编码进阶路径 -->
  <text x="600" y="326" text-anchor="middle" font-size="16" font-weight="500" letter-spacing="2"><tspan fill="#5fd0e0">Classical Control</tspan><tspan fill="#6b7590">&#160;&#160;·&#160;&#160;</tspan><tspan fill="#b9c2d8">Reinforcement Learning</tspan><tspan fill="#6b7590">&#160;&#160;·&#160;&#160;</tspan><tspan fill="#ffab5e">Vision-Language-Action</tspan></text>
</svg>
