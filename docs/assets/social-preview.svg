<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" font-family="'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1d1f"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c7c7cc"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- eyebrow 小字 -->
  <text x="640" y="162" text-anchor="middle" fill="#86868b" font-size="15" font-weight="600" letter-spacing="5">AN OPEN CURRICULUM FOR EMBODIED AI</text>

  <!-- 主字标 -->
  <text x="640" y="312" text-anchor="middle" fill="url(#title)" font-size="168" font-weight="600" letter-spacing="-2">LocoVLA</text>

  <!-- 副标题 -->
  <text x="640" y="384" text-anchor="middle" fill="#a1a1a6" font-size="32" font-weight="400">From Balance Control to Vision-Language-Action</text>
  <text x="640" y="422" text-anchor="middle" fill="#6e6e73" font-size="20" font-weight="400">具身运动智能 · 从平衡控制到视觉语言动作</text>

  <!-- 能力管线（克制的一行分隔点文字） -->
  <text x="640" y="486" text-anchor="middle" fill="#86868b" font-size="18" font-weight="500" letter-spacing="2">Classical Control&#160;&#160;·&#160;&#160;Reinforcement Learning&#160;&#160;·&#160;&#160;Vision-Language-Action</text>
</svg>
