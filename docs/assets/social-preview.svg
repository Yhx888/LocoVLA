<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f24"/>
      <stop offset="0.55" stop-color="#141a3d"/>
      <stop offset="1" stop-color="#20164a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9f0ff"/>
      <stop offset="1" stop-color="#8fb4ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- 蓝图网格 -->
  <g stroke="#3a4a8c" stroke-width="1" opacity="0.10">
    <line x1="0" y1="128" x2="1280" y2="128"/>
    <line x1="0" y1="256" x2="1280" y2="256"/>
    <line x1="0" y1="384" x2="1280" y2="384"/>
    <line x1="0" y1="512" x2="1280" y2="512"/>
    <line x1="160" y1="0" x2="160" y2="640"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
    <line x1="1120" y1="0" x2="1120" y2="640"/>
  </g>

  <!-- 四角细边框 -->
  <g fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="56,104 56,56 104,56"/>
    <polyline points="1224,104 1224,56 1176,56"/>
    <polyline points="56,536 56,584 104,584"/>
    <polyline points="1224,536 1224,584 1176,584"/>
  </g>

  <!-- eyebrow 小字 -->
  <text x="640" y="212" text-anchor="middle" fill="#7c88bf" font-size="16" font-weight="600" letter-spacing="5">REPRODUCIBILITY-FIRST OPEN CURRICULUM</text>

  <!-- 主字标 -->
  <text x="640" y="368" text-anchor="middle" fill="url(#title)" font-size="166" font-weight="700" letter-spacing="4">LocoVLA</text>

  <!-- 字标下渐变短横线 -->
  <rect x="580" y="398" width="120" height="5" rx="2.5" fill="url(#accent)"/>

  <!-- 副标题 -->
  <text x="640" y="458" text-anchor="middle" fill="#aeb9e2" font-size="30" font-weight="500">From Balance Control to Vision-Language-Action</text>
  <text x="640" y="498" text-anchor="middle" fill="#7a86bd" font-size="21">具身运动智能 · Upkie 轮足机器人 + MuJoCo 仿真</text>

  <!-- 能力管线胶囊 -->
  <g font-size="18" font-weight="600" text-anchor="middle">
    <rect x="295" y="556" width="158" height="42" rx="21" fill="none" stroke="#22d3ee" stroke-width="1.6" opacity="0.85"/>
    <text x="374" y="583" fill="#7fe6f4">Classical Control</text>
    <text x="473" y="583" fill="#8aa0d8" font-size="19">→</text>
    <rect x="493" y="556" width="214" height="42" rx="21" fill="none" stroke="#8aa0f0" stroke-width="1.6" opacity="0.85"/>
    <text x="600" y="583" fill="#b7c4f5">Reinforcement Learning</text>
    <text x="727" y="583" fill="#8aa0d8" font-size="19">→</text>
    <rect x="747" y="556" width="238" height="42" rx="21" fill="none" stroke="#a78bfa" stroke-width="1.6" opacity="0.9"/>
    <text x="866" y="583" fill="#c9b6fb">Vision-Language-Action</text>
  </g>
</svg>
