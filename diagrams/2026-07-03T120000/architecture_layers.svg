<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" width="700" height="520">
  <!-- 背景 -->
  <rect x="0" y="0" width="700" height="520" fill="#ffffff" rx="8"/>

  <!-- 标题 -->
  <text x="350" y="36" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="bold" fill="#333333">三层控制架构与数据流</text>

  <!-- ============ 第一层：高层指令 ============ -->
  <rect x="170" y="60" width="360" height="60" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="350" y="88" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="bold" fill="#1565c0">高层指令（High-Level）</text>
  <text x="350" y="108" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#1976d2">"go forward" / "turn left" / "stop"</text>

  <!-- 箭头：高层 → 中层 -->
  <polyline points="350,120 350,145" fill="none" stroke="#1976d2" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="350" y="138" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#1976d2">解析意图</text>

  <!-- ============ 第二层：中层规划 ============ -->
  <rect x="170" y="150" width="360" height="60" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="350" y="178" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="bold" fill="#2e7d32">中层规划（Mid-Level）</text>
  <text x="350" y="198" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#388e3c">mode, velocity, yaw_rate, height</text>

  <!-- 箭头：中层 → 底层 -->
  <polyline points="350,210 350,235" fill="none" stroke="#388e3c" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="350" y="228" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#388e3c">控制参数</text>

  <!-- ============ 第三层：底层控制 ============ -->
  <rect x="170" y="240" width="360" height="60" rx="8" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
  <text x="350" y="268" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="bold" fill="#e65100">底层控制（Low-Level）</text>
  <text x="350" y="288" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#f57c00">PD / LQR / RL / Residual</text>

  <!-- 箭头：底层 → 仿真 -->
  <polyline points="350,300 350,325" fill="none" stroke="#f57c00" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="350" y="318" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#f57c00">关节力矩</text>

  <!-- ============ 第四层：MuJoCo 仿真 ============ -->
  <rect x="170" y="330" width="360" height="60" rx="8" fill="#fce4ec" stroke="#c62828" stroke-width="2"/>
  <text x="350" y="358" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="bold" fill="#b71c1c">MuJoCo 仿真</text>
  <text x="350" y="378" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#c62828">Upkie 机器人物理仿真</text>

  <!-- ============ 反馈回路（左侧） ============ -->
  <!-- 从仿真底部开始，向上回到底层控制器 -->
  <polyline points="170,360 80,360 80,270 170,270" fill="none" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-gray)"/>
  <text x="80" y="320" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#757575" transform="rotate(-90, 80, 320)">传感器反馈（关节角度/速度）</text>

  <!-- ============ 右侧：接口标注 ============ -->
  <!-- 接口 1: 高层 → 中层 -->
  <rect x="560" y="135" width="110" height="36" rx="4" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5"/>
  <text x="615" y="148" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#7b1fa2">接口：文本命令</text>
  <text x="615" y="163" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#9c27b0">→ HighLevelCommand</text>
  <line x1="530" y1="153" x2="558" y2="153" stroke="#7b1fa2" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- 接口 2: 中层 → 底层 -->
  <rect x="560" y="225" width="110" height="36" rx="4" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5"/>
  <text x="615" y="238" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#7b1fa2">接口：状态向量 x</text>
  <text x="615" y="253" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#9c27b0">→ 控制向量 u</text>
  <line x1="530" y1="243" x2="558" y2="243" stroke="#7b1fa2" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- 接口 3: 底层 → 仿真 -->
  <rect x="560" y="315" width="110" height="36" rx="4" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5"/>
  <text x="615" y="328" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#7b1fa2">接口：力矩指令</text>
  <text x="615" y="343" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#9c27b0">→ 物理状态更新</text>
  <line x1="530" y1="333" x2="558" y2="333" stroke="#7b1fa2" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- ============ 底部图例 ============ -->
  <rect x="170" y="420" width="360" height="80" rx="6" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/>
  <text x="350" y="442" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" font-weight="bold" fill="#666">图例</text>

  <line x1="200" y1="460" x2="240" y2="460" stroke="#1976d2" stroke-width="2.5"/>
  <text x="245" y="464" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#666">指令流（从上到下）</text>

  <line x1="200" y1="480" x2="240" y2="480" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="245" y="484" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#666">反馈流（从下到上，虚线）</text>

  <!-- ============ 箭头定义 ============ -->
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1976d2"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#388e3c"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f57c00"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9e9e9e"/>
    </marker>
  </defs>
</svg>